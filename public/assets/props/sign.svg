<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <!-- Wooden $TAP forest sign -->
  <defs>
    <linearGradient id="wd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5f3c"/><stop offset="1" stop-color="#5c3f28"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="132" rx="34" ry="5" fill="#000" opacity="0.2"/>
  <rect x="54" y="58" width="12" height="76" rx="3" fill="url(#wd)"/>
  <path d="M57 70 l6 -2 M57 90 l6 -2 M57 110 l6 -2" stroke="#4a3020" stroke-width="1.5"/>
