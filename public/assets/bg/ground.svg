<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 180" preserveAspectRatio="none">
  <!-- Tileable ground strip: grass top, dirt below (512 wide, tiles on X) -->
  <defs>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3423"/><stop offset="1" stop-color="#2e1f14"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57a356"/><stop offset="1" stop-color="#3c7a3e"/>
    </linearGradient>
  </defs>
  <rect y="36" width="512" height="144" fill="url(#dirt)"/>
  <!-- dirt texture -->
  <g fill="#3a2818" opacity="0.8">
    <ellipse cx="60" cy="90" rx="14" ry="6"/><ellipse cx="180" cy="120" rx="18" ry="7"/>
    <ellipse cx="300" cy="80" rx="12" ry="5"/><ellipse cx="420" cy="130" rx="16" ry="6"/>
    <ellipse cx="490" cy="95" rx="10" ry="4"/><ellipse cx="110" cy="150" rx="15" ry="6"/>
    <ellipse cx="360" cy="155" rx="13" ry="5"/>
  </g>
  <g fill="#5c432c" opacity="0.7">
    <ellipse cx="90" cy="110" rx="8" ry="3"/><ellipse cx="240" cy="95" rx="9" ry="4"/>
    <ellipse cx="390" cy="105" rx="7" ry="3"/><ellipse cx="470" cy="150" rx="8" ry="3"/>
  </g>
  <!-- grass -->
  <path d="M0 44 q32 -14 64 -6 q40 -16 80 -4 q36 -12 72 -2 q42 -14 84 -4 q38 -12 76 -2 q40 -12 80 -2 q40 -10 76 0 l0 30 l-512 0 z" fill="url(#grass)"/>
  <!-- grass blades -->
  <g stroke="#67b765" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M30 40 q-3 -12 -8 -16 M52 38 q2 -12 8 -18 M120 36 q-2 -10 -7 -14 M200 34 q3 -12 9 -16 M280 34 q-3 -10 -8 -14 M350 32 q2 -10 7 -14 M430 34 q-2 -12 -8 -16 M495 36 q3 -10 8 -14"/>
  </g>
  <g stroke="#4c8f4a" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M80 40 q-2 -9 -6 -12 M160 38 q2 -9 6 -12 M240 36 q-2 -8 -6 -11 M320 34 q2 -9 6 -12 M400 36 q-2 -8 -6 -11 M460 38 q2 -9 6 -12"/>
  </g>
</svg>
