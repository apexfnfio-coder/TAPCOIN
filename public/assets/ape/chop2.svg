<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <!-- $TAP Ape — chop impact (axe swung down-forward) -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4632"/><stop offset="1" stop-color="#43331f"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/><stop offset="1" stop-color="#1b2025"/>
    </linearGradient>
  </defs>
  <ellipse cx="58" cy="132" rx="30" ry="6" fill="#000" opacity="0.25"/>
  <!-- lunging legs -->
  <path d="M46 106 l-8 18 q-2 5 3 6 l7 1 q4 0 4 -5 l3 -19 z" fill="url(#fur)"/>
  <path d="M64 106 l8 18 q2 5 6 4 l7 -2 q4 -2 2 -6 l-8 -16 z" fill="url(#fur)"/>
  <ellipse cx="42" cy="129" rx="9" ry="4" fill="#2e2416"/>
  <ellipse cx="78" cy="127" rx="9" ry="4" fill="#2e2416"/>
  <!-- body leaning forward -->
  <path d="M36 68 q-2 24 6 42 q18 8 36 0 q8 -20 2 -44 q-22 -8 -44 2 z" fill="url(#hood)"/>
  <text x="56" y="92" font-family="Arial Black, Arial" font-size="11" font-weight="900" fill="#f2b53c" text-anchor="middle">$TAP</text>
  <!-- axe swung forward-down -->
  <g transform="rotate(112 76 74)">
    <rect x="72" y="26" width="7" height="64" rx="3" fill="#7a5230"/>
    <path d="M68 20 q14 -8 24 2 q-2 12 -12 14 q-10 1 -12 -16 z" fill="#b9c4cc" stroke="#7f8b94" stroke-width="1.5"/>
    <path d="M86 18 q6 4 6 10" stroke="#e8eef2" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  <!-- both arms extended forward -->
  <path d="M72 66 q18 2 30 10" stroke="#5b4632" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M46 70 q16 6 30 8" stroke="#4a3a2a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="104" cy="78" r="7" fill="#6b5440"/>
  <circle cx="78" cy="79" r="6" fill="#6b5440"/>
  <ellipse cx="58" cy="44" rx="25" ry="23" fill="url(#fur)"/>
  <circle cx="36" cy="46" r="7" fill="#43331f"/>
  <circle cx="36" cy="46" r="3.5" fill="#8a6a4e"/>
  <ellipse cx="67" cy="52" rx="15" ry="12" fill="#a87f58"/>
  <ellipse cx="72" cy="49" rx="3" ry="2" fill="#3a2c1c"/>
  <path d="M60 58 q8 3 14 -2" stroke="#3a2c1c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="59" cy="42" rx="5" ry="4" fill="#fff"/>
  <circle cx="61" cy="42" r="2.6" fill="#20180f"/>
  <ellipse cx="75" cy="42" rx="4.5" ry="4" fill="#fff"/>
  <circle cx="77" cy="42" r="2.3" fill="#20180f"/>
  <path d="M53 36 l12 1 M70 36 l10 -2" stroke="#2e2416" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 38 q0 -22 25 -22 q22 0 22 18 l-6 2 q-20 -8 -37 0 z" fill="#14161a"/>
  <path d="M76 32 q16 0 22 6 q-10 5 -24 3 z" fill="#14161a"/>
  <text x="57" y="29" font-family="Arial Black, Arial" font-size="10" font-weight="900" fill="#f2b53c" text-anchor="middle">$TAP</text>
  <!-- impact burst at axe head -->
  <g transform="translate(118 96)">
    <path d="M0 -12 L3 -3 L12 -4 L5 2 L8 11 L0 6 L-8 11 L-5 2 L-12 -4 L-3 -3 Z" fill="#ffd25e"/>
    <circle r="3" fill="#fff2c0"/>
  </g>
</svg>
