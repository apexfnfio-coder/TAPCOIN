<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <!-- $TAP Ape — idle, facing right, axe resting on shoulder -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4632"/><stop offset="1" stop-color="#43331f"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/><stop offset="1" stop-color="#1b2025"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="60" cy="132" rx="30" ry="6" fill="#000" opacity="0.25"/>
  <!-- tail hint -->
  <path d="M34 100 q-12 4 -10 14" stroke="#43331f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M48 106 l-3 20 q-1 5 4 5 l7 0 q4 0 3 -5 l-2 -20 z" fill="url(#fur)"/>
  <path d="M66 106 l2 20 q1 5 5 5 l7 0 q4 -1 3 -5 l-3 -20 z" fill="url(#fur)"/>
  <ellipse cx="50" cy="130" rx="9" ry="4" fill="#2e2416"/>
  <ellipse cx="76" cy="130" rx="9" ry="4" fill="#2e2416"/>
  <!-- body / hoodie -->
  <path d="M38 66 q-4 26 4 44 q18 8 36 0 q8 -18 4 -44 q-22 -10 -44 0 z" fill="url(#hood)"/>
  <path d="M46 92 q14 8 28 0 l-2 12 q-12 6 -24 0 z" fill="#16191d"/>
  <text x="60" y="86" font-family="Arial Black, Arial" font-size="11" font-weight="900" fill="#f2b53c" text-anchor="middle">$TAP</text>
  <!-- axe resting on shoulder -->
  <g transform="rotate(-24 78 60)">
    <rect x="74" y="18" width="7" height="70" rx="3" fill="#7a5230"/>
    <path d="M70 14 q14 -8 24 2 q-2 12 -12 14 q-10 1 -12 -16 z" fill="#b9c4cc" stroke="#7f8b94" stroke-width="1.5"/>
    <path d="M88 12 q6 4 6 10" stroke="#e8eef2" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  <!-- arm on axe -->
  <path d="M76 66 q10 -8 12 -20" stroke="#5b4632" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="45" r="7" fill="#6b5440"/>
  <!-- left arm hanging -->
  <path d="M40 68 q-8 14 -4 28" stroke="#4a3a2a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="36" cy="98" r="6" fill="#6b5440"/>
  <!-- head -->
  <ellipse cx="62" cy="42" rx="25" ry="23" fill="url(#fur)"/>
  <circle cx="40" cy="44" r="7" fill="#43331f"/>
  <circle cx="40" cy="44" r="3.5" fill="#8a6a4e"/>
  <ellipse cx="71" cy="50" rx="15" ry="12" fill="#a87f58"/>
  <ellipse cx="76" cy="47" rx="3" ry="2" fill="#3a2c1c"/>
  <path d="M64 56 q8 4 15 0" stroke="#3a2c1c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- eyes (gritty) -->
  <ellipse cx="63" cy="40" rx="5" ry="5.5" fill="#fff"/>
  <circle cx="64.5" cy="41" r="2.6" fill="#20180f"/>
  <ellipse cx="79" cy="40" rx="4.5" ry="5" fill="#fff"/>
  <circle cx="80.5" cy="41" r="2.3" fill="#20180f"/>
  <path d="M57 33 l12 2 M74 34 l10 -1" stroke="#2e2416" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cap -->
  <path d="M38 36 q0 -22 25 -22 q22 0 22 18 l-6 2 q-20 -8 -37 0 z" fill="#14161a"/>
  <path d="M80 30 q16 0 22 6 q-10 5 -24 3 z" fill="#14161a"/>
  <text x="61" y="27" font-family="Arial Black, Arial" font-size="10" font-weight="900" fill="#f2b53c" text-anchor="middle">$TAP</text>
</svg>
