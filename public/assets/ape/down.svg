<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110">
  <!-- $TAP Ape — game over (sitting slumped, axe beside) -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4632"/><stop offset="1" stop-color="#43331f"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/><stop offset="1" stop-color="#1b2025"/>
    </linearGradient>
  </defs>
  <ellipse cx="66" cy="100" rx="40" ry="6" fill="#000" opacity="0.25"/>
  <!-- axe lying on ground -->
  <g transform="rotate(84 110 92)">
    <rect x="106" y="52" width="6" height="52" rx="3" fill="#7a5230"/>
    <path d="M102 48 q12 -7 21 2 q-2 10 -10 12 q-9 1 -11 -14 z" fill="#b9c4cc" stroke="#7f8b94" stroke-width="1.5"/>
  </g>
  <!-- seated body -->
  <path d="M40 56 q-8 22 2 38 q20 8 40 0 q10 -16 2 -38 q-22 -10 -44 0 z" fill="url(#hood)"/>
  <text x="62" y="80" font-family="Arial Black, Arial" font-size="11" font-weight="900" fill="#f2b53c" text-anchor="middle">$TAP</text>
  <!-- legs sprawled forward -->
  <path d="M48 88 l-22 6 q-6 2 -4 6 q2 4 8 3 l24 -6 z" fill="url(#fur)"/>
  <path d="M76 88 l22 6 q6 2 4 6 q-2 4 -8 3 l-24 -6 z" fill="url(#fur)"/>
  <ellipse cx="24" cy="98" rx="8" ry="4" fill="#2e2416"/>
  <ellipse cx="100" cy="98" rx="8" ry="4" fill="#2e2416"/>
  <!-- arms slumped -->
  <path d="M44 62 q-10 12 -8 26" stroke="#4a3a2a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M80 62 q10 12 8 26" stroke="#5b4632" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="35" cy="90" r="6" fill="#6b5440"/>
  <circle cx="89" cy="90" r="6" fill="#6b5440"/>
  <!-- head drooped -->
  <g transform="rotate(8 62 34)">
    <ellipse cx="62" cy="34" rx="25" ry="23" fill="url(#fur)"/>
    <circle cx="40" cy="36" r="7" fill="#43331f"/>
    <circle cx="40" cy="36" r="3.5" fill="#8a6a4e"/>
    <ellipse cx="71" cy="42" rx="15" ry="12" fill="#a87f58"/>
    <ellipse cx="76" cy="39" rx="3" ry="2" fill="#3a2c1c"/>
    <path d="M64 50 q7 -3 14 0" stroke="#3a2c1c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- tired half-closed eyes -->
    <path d="M57 34 l12 0 M74 34 l10 0" stroke="#20180f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38 28 q0 -22 25 -22 q22 0 22 18 l-6 2 q-20 -8 -37 0 z" fill="#14161a"/>
    <path d="M80 22 q16 0 22 6 q-10 5 -24 3 z" fill="#14161a"/>
    <text x="61" y="19" font-family="Arial Black, Arial" font-size="10" font-weight="900" fill="#f2b53c" text-anchor="middle">$TAP</text>
  </g>
</svg>
